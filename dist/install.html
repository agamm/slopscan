<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slopscan</title>
<style>
:root{color-scheme:light dark;--ink:#14141a;--dim:#6b6b78;--line:#d9d9e3;--bg:#fbfbfd;--bar:#eeeef3;--accent:#ff2d55}
@media (prefers-color-scheme:dark){:root{--ink:#e8e8ef;--dim:#8b8b9b;--line:#2c2c36;--bg:#0b0b0f;--bar:#16161d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}

/* a stand-in for the browser's bookmarks bar, so "up there" has a target */
.bar{height:44px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px}
.bar i{width:64px;height:10px;border-radius:5px;background:var(--line)}
.slot{position:relative;width:104px;height:28px;border:1.5px dashed var(--accent);border-radius:7px}
.chip{position:absolute;inset:3px;border-radius:5px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;
  line-height:19px;opacity:0;animation:land 3.2s ease-in-out infinite}

/* the path the button travels: dashes flowing upward into the slot */
.arrow{position:relative;width:2px;height:100px;margin:10px auto 0;
  background:repeating-linear-gradient(to top,var(--dim) 0 6px,transparent 6px 12px);animation:flow .9s linear infinite}
.arrow::before{content:'';position:absolute;left:-6px;top:-2px;width:10px;height:10px;
  border-left:2px solid var(--dim);border-top:2px solid var(--dim);transform:rotate(45deg)}

.btn{position:relative;width:max-content;margin:8px auto 0}
a.bm{display:inline-block;height:44px;line-height:44px;padding:0 26px;border-radius:9px;background:var(--ink);color:var(--bg);
  text-decoration:none;font-weight:700;font-size:16px;cursor:grab;box-shadow:0 0 0 0 var(--accent);
  transition:transform .15s,box-shadow .15s}
a.bm:hover{transform:translateY(-2px);box-shadow:0 0 0 3px var(--accent)}
a.bm:active{cursor:grabbing}
/* a ghost of the button rehearses the drag, 162px = button centre to slot centre */
.ghost{position:absolute;inset:0;border-radius:9px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;
  line-height:44px;pointer-events:none;opacity:0;animation:rise 3.2s ease-in-out infinite}

.hint{margin:18px 0 4px;font-weight:600}
.keys{margin:0;color:var(--dim);font-size:13px}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}

main{margin:64px auto 48px;max-width:420px;padding:0 20px}
h1{font-size:22px;margin:0 0 4px}
main p{color:var(--dim);margin:0 0 18px}
main a{color:var(--ink)}

@keyframes flow{to{background-position:0 -12px}}
@keyframes rise{
  0%,12%{opacity:0;transform:none}
  18%{opacity:.85;transform:translateY(-6px) rotate(-2deg)}
  62%{opacity:.85;transform:translateY(-162px) scale(.62)}
  70%,100%{opacity:0;transform:translateY(-162px) scale(.62)}}
@keyframes land{0%,62%{opacity:0}68%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.arrow,.ghost,.chip{animation:none}}
</style></head><body>
